services:
  - type: web
    name: clarity-ai-tutor-plus
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clarity-tutor-db-v2
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
databases:
  - name: clarity-tutor-db-v2
    databaseName: clarity
    user: clarity
    plan: free
