services:
  - type: web
    name: clarity-preview
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
